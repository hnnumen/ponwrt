name: Build PonWrt (Online)

# 手动触发的在线编译工作流。
# 用法：Fork 本仓库 -> 把本文件放到 .github/workflows/build.yml -> GitHub Actions 页面手动 Run workflow。
# 编译结果以 artifact 形式保留 30 天，下载后解压即可刷机。
on:
  workflow_dispatch:
    inputs:
      target:
        description: "目标 SoC：an7581 覆盖 Nokia XG-040G-MD / XG-140G-TF（AN7581）；an7583 覆盖 XG-040G-MF（AN7583）"
        required: true
        default: an7581
        type: choice
        options:
          - an7581
          - an7583

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.target }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ inputs.target }}-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: |
            ponwrt-dl-${{ inputs.target }}-

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure ${{ inputs.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ inputs.target }}.config" \
            configs/release.config > .config
          make defconfig

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ inputs.target }}
        run: make -j"$(nproc)"

      - name: Pack ${{ inputs.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ inputs.target }}.tar.zst" \
            -C bin/targets/airoha "${{ inputs.target }}"

      - name: Upload ${{ inputs.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ inputs.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release assets
        if: success()
        run: |
          set -e
          mkdir -p release
          sha256sum release/*.tar.zst > release/sha256sums
          cd release
          [ -f sha256sums ] || sha256sum * > sha256sums
          echo "----- 待发布资产 -----"
          ls -la

      - name: Publish to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: ${{ inputs.target }}-latest
          REL_TITLE: PonWrt ${{ inputs.target }} (rolling)
        run: |
          set -e
          cd release
          echo "目标 Release: $REL_TAG"
          if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在 -> 覆盖同名资产"
            gh release upload "$REL_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            echo "Release 不存在 -> 创建"
            gh release create "$REL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$REL_TITLE" \
              --prerelease \
              --notes "自动发布：ponwrt ${{ inputs.target }} 固件（滚动更新）。\n每次编译成功后自动更新本 Release 的资产，下载链接固定不变。" \
              ./*
          fi
          echo "完成: https://github.com/$GITHUB_REPOSITORY/releases/tag/$REL_TAG"
