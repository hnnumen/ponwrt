name: Build HM2004-DU from PR #15 (ponwrt)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "发布到 GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache /usr/lib/jvm /usr/local/lib/android \
            /usr/share/swift /usr/lib/mono /opt/microsoft /usr/local/.ghcup \
            /usr/local/go 2>/dev/null || true
          sudo apt-get clean -y
          df -h /

      - name: Checkout fork (ponwrt source)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools unzip zlib1g-dev file wget rsync subversion \
            ccache device-tree-compiler

      - name: Overlay HM2004-DU support from PR #15 (qwe3017/ponwrt @ 9def82)
        run: |
          set -e
          git config user.email "bot@workbuddy.local"
          git config user.name "WorkBuddy Build"
          git remote add pr15 https://github.com/qwe3017/ponwrt
          git fetch pr15 master
          git checkout FETCH_HEAD -- \
            README.md \
            package/firmware/h3c-hm2004-du-mt7916-eeprom \
            target/linux/airoha/an7581/base-files/etc/board.d/01_leds \
            target/linux/airoha/an7581/base-files/etc/board.d/02_network \
            target/linux/airoha/an7581/base-files/lib/upgrade/platform.sh \
            target/linux/airoha/base-files/etc/board.d/03_pon_data \
            target/linux/airoha/dts/an7581-h3c-hm2004-du.dts \
            target/linux/airoha/dts/an7581-npu-wlan.dtsi \
            target/linux/airoha/image/an7581.mk
          echo "---- verify PR #15 DTS present ----"
          ls -l target/linux/airoha/dts/an7581-h3c-hm2004-du.dts
          grep -c "h3c_hm2004-du" target/linux/airoha/image/an7581.mk

      - name: Configure (single device HM2004-DU)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_h3c_hm2004-du=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          grep -E 'CONFIG_TARGET_airoha_an7581_DEVICE' .config

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build HM2004-DU
        run: make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: List build output (diagnostic)
        if: always()
        run: |
          echo "===== bin/targets/airoha/an7581 ====="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "NO TARGET DIR"
          echo "===== 2004-related files ====="
          find bin -iname '*hm2004*' 2>/dev/null || true

      - name: Upload HM2004-DU images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hm2004-du-pr15-images
          path: bin/targets/airoha/an7581/
          if-no-files-found: error

      - name: Prepare release assets
        if: success()
        run: |
          set -e
          mkdir -p release
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'sha256sums' \) -exec cp -v {} release/ \;
          cd release
          [ -f sha256sums ] || sha256sum * > sha256sums
          ls -la

      - name: Publish to GitHub Release
        if: success() && (github.event.inputs.publish_release != 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: hm2004-du-pr15-latest
          REL_TITLE: HM2004-DU PonWrt (PR #15 rolling)
        run: |
          set -e
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<RELNOTES
          H3C HM2004-DU (`h3c,hm2004-du` / Airoha AN7581) 的 ponwrt 固件，基于 PR #15 (qwe3017/ponwrt @ 9def82ab)。

          含 MT7916 Wi-Fi、PON 栈 (en7572/xpon/ponctl/pond)、board.d 运行时配置。

          - `*-squashfs-sysupgrade.itb`：正式固件，刷进 flash
          - `*-initramfs-recovery.itb`：内存版系统，用于首次安装 / 救砖

          Run: $GITHUB_RUN_ID / Commit: $GITHUB_SHA
          RELNOTES
          cd release
          if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$REL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$REL_TITLE" \
              --prerelease \
              --notes-file "$NOTES_FILE" \
          fi
          echo "完成: https://github.com/$GITHUB_REPOSITORY/releases/tag/$REL_TAG"
