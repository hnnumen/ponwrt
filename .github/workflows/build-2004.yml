name: Build HM2004-DU (ponwrt)

on:
  workflow_dispatch:
  push:
    branches: [build-2004]

# Builds only this fork's content; never touches upstream.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            /opt/hostedtoolcache /usr/lib/jvm /usr/local/lib/android \
            /usr/share/swift /usr/lib/mono /opt/microsoft /usr/local/.ghcup \
            /usr/local/go 2>/dev/null || true
          sudo apt-get clean -y
          df -h /

      - name: Checkout this fork (already carries the 2004 profile)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools unzip zlib1g-dev file wget rsync subversion \
            ccache

      - name: Apply HM2004-DU device profile
        run: |
          set -e
          DTS=target/linux/airoha/dts
          cp -v hm2004-du/dts/an7581-h3c-hm2004-du.dts        "$DTS/"
          cp -v hm2004-du/dts/an7581-h3c-hm2004-du.dtsi       "$DTS/"
          cp -v hm2004-du/dts/an7581-h3c-hm2004-du-ubi-parts.dtsi "$DTS/"
          MK=target/linux/airoha/image/an7581.mk
          grep -q "h3c_hm2004-du" "$MK" || cat hm2004-du/an7581.mk.addition >> "$MK"

      - name: Configure (single device HM2004-DU)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # OpenWrt keeps the device name AS-IS in the Kconfig symbol
          # (hyphens preserved, NOT sanitized to underscores): the option is
          # CONFIG_TARGET_airoha_an7581_DEVICE_h3c_hm2004-du
          cat > .config <<'EOF'
          CONFIG_TARGET_airoha=y
          CONFIG_TARGET_airoha_an7581=y
          CONFIG_TARGET_airoha_an7581_DEVICE_h3c_hm2004-du=y
          CONFIG_CCACHE=y
          EOF
          make defconfig
          # Sanity: confirm only the 2004 device is selected
          grep -E 'CONFIG_TARGET_airoha_an7581_DEVICE' .config

      - name: Build HM2004-DU
        run: make -j"$(nproc)" V=s

      - name: List build output (diagnostic)
        if: always()
        run: |
          echo "===== bin/targets/airoha/an7581 ====="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "NO TARGET DIR"
          echo "===== 2004-related files ====="
          find bin -iname '*hm2004*' 2>/dev/null || true
          echo "===== DTC / build errors (if any) ====="
          grep -n -i -E 'undefined|expecting|error:|No rule to make|recipe for target|failed to build' build.log 2>/dev/null | tail -150 > bin/targets/airoha/an7581/build_error.txt || true
          echo "captured build_error.txt ($(wc -l < bin/targets/airoha/an7581/build_error.txt 2>/dev/null || echo 0) lines)"

      - name: Upload HM2004-DU images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hm2004-du-images
          path: bin/targets/airoha/an7581/
          if-no-files-found: error

      - name: Prepare release assets
        if: success()
        run: |
          set -e
          mkdir -p release
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'sha256sums' \) -exec cp -v {} release/ \;
          cd release
          [ -f sha256sums ] || sha256sum * > sha256sums
          echo "----- 待发布资产 -----"
          ls -la

      - name: Publish to GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: hm2004-du-latest
          REL_TITLE: HM2004-DU PonWrt (rolling)
        run: |
          set -e
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<RELNOTES
          自动发布：H3C HM2004-DU (`h3c,hm2004-du` / Airoha AN7581) 的 ponwrt 固件。
          
          每次编译成功后自动更新本 Release 的资产，**下载链接固定不变**。
          
          - `*-squashfs-sysupgrade.itb`：正式固件，刷进 flash
          - `*-initramfs-recovery.itb`：内存版系统，不写 flash，用于首次安装 / 救砖
          
          Run: $GITHUB_RUN_ID / Commit: $GITHUB_SHA
          RELNOTES
          cd release
          echo "目标 Release: $REL_TAG"
          if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release 已存在 -> 覆盖同名资产"
            gh release upload "$REL_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            echo "Release 不存在 -> 创建"
            gh release create "$REL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$REL_TITLE" \
              --prerelease \
              --notes-file "$NOTES_FILE" \
          fi
          echo "完成: https://github.com/$GITHUB_REPOSITORY/releases/tag/$REL_TAG"
