name: Build HM2004-DU (upstream ponwrt master)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "发布到 GitHub Release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: hm2004-du-upstream
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SRC_REPO: pbs05/ponwrt
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /usr/share/swift \
            /opt/hostedtoolcache /usr/lib/jvm /usr/lib/mono /opt/microsoft \
            /usr/local/.ghcup /usr/local/go 2>/dev/null || true
          sudo apt-get clean -y
          df -h /

      - name: Checkout build config repo (this fork)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: ci

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools \
            python3-dev rsync unzip zlib1g-dev file wget subversion quilt \
            ccache device-tree-compiler

      # HM2004-DU support (dts / an7581.mk / board.d / platform.sh) is now
      # upstream in pbs05/ponwrt master, so we build upstream source directly
      # and only carry our .config from this fork.
      - name: Clone upstream ponwrt (master)
        run: |
          set -e
          git clone --depth 1 https://github.com/$SRC_REPO.git openwrt
          cd openwrt
          git log -1 --format='UPSTREAM_SHA=%H%nUPSTREAM_DATE=%cI%nUPSTREAM_SUBJECT=%s' | tee build-provenance.txt
          git log -1 --format=%H > ../ci/upstream_sha.txt

      - name: Verify HM2004-DU support is present upstream
        working-directory: openwrt
        run: |
          set -e
          ls -l target/linux/airoha/dts/an7581-h3c-hm2004-du.dts
          grep -c 'h3c_hm2004-du' target/linux/airoha/image/an7581.mk
          grep -c 'h3c,hm2004-du' target/linux/airoha/an7581/base-files/etc/board.d/02_network
          grep -c 'h3c,hm2004-du' target/linux/airoha/base-files/etc/board.d/03_pon_data

      - name: Update & install feeds
        working-directory: openwrt
        run: |
          set -e
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (single device h3c_hm2004-du)
        working-directory: openwrt
        run: |
          set -e
          cp ../ci/configs/hm2004.config .config
          make defconfig
          echo "===== selected devices ====="
          grep -E '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config
          echo "===== assert only one ====="
          n=$(grep -cE '^CONFIG_TARGET_airoha_an7581_DEVICE_.*=y$' .config || true)
          echo "selected an7581 devices: $n"
          test "$n" = "1"
          grep -q '^CONFIG_TARGET_airoha_an7581_DEVICE_h3c_hm2004-du=y$' .config
          # CONFIG_TARGET_MULTI_PROFILE is a deprecated alias in the same kconfig
          # choice as PER_DEVICE_ROOTFS; if both are y the profile choice gets
          # overridden and every device silently drops out. Guard against it.
          ! grep -qE '^CONFIG_TARGET_MULTI_PROFILE=y$' .config
          # no leftover legacy double-prefixed device rows
          ! grep -qE '^CONFIG_TARGET_DEVICE_' .config

      - name: Download sources
        working-directory: openwrt
        run: make download -j"$(nproc)" V=s

      - name: Build HM2004-DU
        working-directory: openwrt
        run: make -j"$(nproc)" V=s 2>&1 | tee build.log

      - name: List build output (diagnostic)
        if: always()
        working-directory: openwrt
        run: |
          echo "===== bin/targets/airoha/an7581 ====="
          ls -la bin/targets/airoha/an7581/ 2>/dev/null || echo "NO TARGET DIR"
          echo "===== hm2004 images ====="
          find bin -iname '*hm2004*' 2>/dev/null || true
          echo "===== errors (if any) ====="
          grep -n -i -E 'undefined reference|Error [0-9]|No rule to make|recipe for target|failed to build' build.log 2>/dev/null | tail -120 || true

      - name: Upload HM2004-DU images
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hm2004-du-images
          path: openwrt/bin/targets/airoha/an7581/
          if-no-files-found: error

      - name: Prepare release assets
        if: success()
        working-directory: openwrt
        run: |
          set -e
          mkdir -p release
          find bin/targets/airoha/an7581 -maxdepth 1 -type f \
            \( -name '*.itb' -o -name 'sha256sums' \) -exec cp -v {} release/ \;
          cp build.log release/build.log 2>/dev/null || true
          cd release
          [ -f sha256sums ] || sha256sum * > sha256sums
          ls -la

      - name: Publish to GitHub Release
        if: success() && (github.event.inputs.publish_release != 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          REL_TAG: hm2004-du-upstream-latest
          REL_TITLE: HM2004-DU PonWrt (upstream master rolling)
        run: |
          set -e
          NOTES_FILE="$(mktemp)"
          UP_SHA="$(cat ci/upstream_sha.txt 2>/dev/null || echo unknown)"
          cat > "$NOTES_FILE" <<RELNOTES
          H3C HM2004-DU (\`h3c,hm2004-du\` / Airoha AN7581) 的 ponwrt 固件。

          源码：pbs05/ponwrt @ \`${UP_SHA}\`（HM2004-DU 支持已合入上游 master）

          - \`*-squashfs-sysupgrade.itb\`：正式固件
          - \`*-initramfs-recovery.itb\`：内存版系统，首次安装 / 救砖
          - \`build.log\`：完整编译日志

          Run: \`$GITHUB_RUN_ID\`
          RELNOTES
          cd openwrt/release
          if gh release view "$REL_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$REL_TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$REL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$REL_TITLE" \
              --prerelease \
              --notes-file "$NOTES_FILE" \
              ./*
          fi
          echo "done: https://github.com/$GITHUB_REPOSITORY/releases/tag/$REL_TAG"